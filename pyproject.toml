
[project]
name = "breakpoint2bedsv"
version = "1.1.1"
description = "Convert SV breakpoints from VCF/BCF to BED"
license = "GPL-3.0-or-later"
authors = [
    { name = "Geoffroy Véronique", email = "veronique.geoffroy@inserm.fr" }
]
requires-python = ">=3.8"
dependencies = [
    "pysam==0.22.1",
    "variant-extractor==5.1.0",
]

[project.scripts]
breakpoint2bedsv = "breakpoint2bedsv.cli:main"

[tool.poetry]
packages = [
    { include = "breakpoint2bedsv" }
]


[tool.poetry.group.dev.dependencies]
pytest = "7.2.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"